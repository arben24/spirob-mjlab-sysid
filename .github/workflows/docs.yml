# Build the MkDocs site and publish it to GitHub Pages.
#
# Adapted from a GitLab CI pipeline (stages -> jobs, GitLab Pages `public/`
# artifact -> the actions/deploy-pages artifact). Two jobs: `build` renders the
# site on every push and pull request so a broken build is caught in review;
# `deploy` publishes, and only from `main`.
#
# ONE-TIME SETUP, REQUIRED BEFORE THE FIRST DEPLOY:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is done the repository has no Pages site (the API reports
# has_pages: false) and the deploy job fails with a 404 that names this exact
# setting. Building the site does not create it.

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: only the deploy job needs to write Pages.
permissions:
  contents: read

# Allow one deployment at a time. Queued runs are superseded, but a deployment
# already in flight is never cancelled -- cancelling one can leave the published
# site half-updated.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The README is the site's landing page. Keeping one source avoids the
      # two drifting apart; the link rewrite fixes the paths that are relative
      # to the repository root but have to resolve from docs/.
      # `uv run --no-project python` rather than bare `python`: without
      # actions/setup-python the runner is not guaranteed to expose `python`
      # on PATH. The script itself is stdlib only.
      - name: Generate the landing page from README.md
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, re

          text = pathlib.Path("README.md").read_text()

          # docs/img/x.png -> img/x.png   (the page already lives in docs/)
          text = re.sub(r'(\(|src=")docs/img/', r'\1img/', text)
          # docs/sysid/index.md -> sysid/index.md, etc.
          text = re.sub(r'\((docs/)([^)]+\.md)\)', r'(\2)', text)
          # links to repo files that have no page on the site -> GitHub
          repo = "https://github.com/arben24/spirob-mjlab-sysid/blob/main"
          for target in ("scripts/generate_model.py", "sysid/README.md",
                         "rl/README.md", "data/README.md", "CLAUDE.md", "rl/"):
              text = text.replace(f"]({target})", f"]({repo}/{target})")

          pathlib.Path("docs/index.md").write_text(text)
          print("docs/index.md written")
          PY

      # `uv run --no-project` builds an ephemeral environment with just these two
      # packages. It deliberately does NOT install this project: rendering the
      # site must not need MuJoCo, OpenCV or a serial port. (`--system` would
      # target the runner's /usr, which is externally managed -- PEP 668.)
      - name: Build the site
        run: >
          uv run --no-project
          --with "mkdocs>=1.6,<2"
          --with "mkdocs-material>=9.5,<10"
          mkdocs build --strict --site-dir public

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Only publish from main; pull requests build but do not deploy.
    #
    # Do NOT add a `github.event.repository.has_pages` guard here. It looks like
    # it prevents the 404 that deploy-pages raises when Pages is disabled, but
    # it only converts that loud, linkable error into a green pipeline that
    # publishes nothing -- which is far harder to diagnose. If this job fails
    # with a 404, the fix is the one-time repository setting at the top of this
    # file, not a condition on this job.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

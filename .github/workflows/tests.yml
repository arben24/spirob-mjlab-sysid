# Run the test suite on every push and pull request.
#
# The tests need MuJoCo but no display, no GPU and no hardware: they load the
# tracked models, step them, and check that the shipped measurement data still
# has the shape every script expects.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Core + dev only: the vision/hardware/gui extras are not needed to test
      # the model and the data, and pulling OpenCV and Qt would triple CI time.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

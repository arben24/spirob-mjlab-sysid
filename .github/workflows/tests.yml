# Run the test suite on every push and pull request.
#
# The tests need MuJoCo but no display, no GPU and no hardware: they load the
# tracked models, step them, and check that the shipped measurement data still
# has the shape every script expects.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Core + dev only: the vision/hardware/gui extras are not needed to test
      # the model and the data, and pulling OpenCV and Qt would triple CI time.
      # `--python` is required -- a bare `uv venv` takes the runner's default
      # interpreter and would silently run both matrix legs on the same one.
      # `uv sync` resolves from the committed uv.lock, which is the point of
      # tracking it.
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # `--extra dev` is required on every `uv run` as well, not just on the
      # sync: a bare `uv run` re-syncs the environment to the default extras
      # and would uninstall ruff and pytest before trying to launch them.
      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Test
        run: uv run --extra dev pytest -q
